<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft AI - Website Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #FAFAF7;
            --paper-raised: #FFFFFF;
            --ink: #1A1A2E;
            --ink-soft: #5C5C72;
            --indigo: #5B5FEF;
            --indigo-deep: #4347C4;
            --mint: #00D4B5;
            --coral: #FF6B6B;
            --line: #E6E4DD;
            --shadow: rgba(26, 26, 46, 0.08);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(91, 95, 239, 0.06), transparent 45%),
                radial-gradient(circle at 88% 92%, rgba(0, 212, 181, 0.06), transparent 45%);
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            padding: 56px 24px 80px;
        }

        /* ---------- Header ---------- */
        .page-head {
            max-width: 760px;
            margin: 0 auto 40px;
            text-align: center;
            opacity: 0;
            animation: riseIn 0.7s ease-out forwards;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            letter-spacing: 0.08em;
            color: var(--indigo-deep);
            background: rgba(91, 95, 239, 0.08);
            border: 1px solid rgba(91, 95, 239, 0.18);
            border-radius: 999px;
            padding: 6px 14px;
            margin-bottom: 18px;
        }

        .eyebrow .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--mint);
            box-shadow: 0 0 0 0 rgba(0, 212, 181, 0.6);
            animation: pulseDot 2s infinite;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.1;
            margin: 0 0 12px;
            letter-spacing: -0.01em;
        }

        h1 .accent {
            background: linear-gradient(100deg, var(--indigo) 10%, var(--mint) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subhead {
            font-size: 16px;
            color: var(--ink-soft);
            margin: 0;
            line-height: 1.6;
        }

        /* ---------- Console card ---------- */
        .console {
            max-width: 760px;
            margin: 0 auto;
            background: var(--paper-raised);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px var(--shadow), 0 20px 48px -24px var(--shadow);
            overflow: hidden;
            opacity: 0;
            animation: riseIn 0.7s ease-out 0.12s forwards;
        }

        .console-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #FCFCFA, #FAFAF7);
        }

        .console-bar .traffic {
            display: flex;
            gap: 7px;
            margin-right: 8px;
        }

        .console-bar .traffic span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .traffic .r { background: #FF6B6B; }
        .traffic .y { background: #FFC857; }
        .traffic .g { background: #00D4B5; }

        .console-bar .label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--ink-soft);
        }

        .console-body {
            padding: 24px;
        }

        /* ---------- Textarea ---------- */
        .field-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.05em;
            color: var(--ink-soft);
            text-transform: uppercase;
            margin: 0 0 10px;
        }

        textarea#promptInput {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            font-family: 'Inter', sans-serif;
            font-size: 15.5px;
            line-height: 1.55;
            color: var(--ink);
            background: #FCFCFB;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            padding: 16px 18px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        textarea#promptInput::placeholder {
            color: #A8A6B8;
        }

        textarea#promptInput:hover {
            border-color: #D4D2C8;
        }

        textarea#promptInput:focus {
            border-color: var(--indigo);
            background: var(--paper-raised);
            box-shadow: 0 0 0 4px rgba(91, 95, 239, 0.12);
        }

        /* ---------- Buttons row ---------- */
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            padding: 12px 20px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible {
            outline: 2px solid var(--indigo);
            outline-offset: 2px;
        }

        button:active {
            transform: translateY(1px) scale(0.99);
        }

        /* tab-style buttons */
        #previewTab, #codeTab {
            background: #F1F0EA;
            color: var(--ink-soft);
            position: relative;
        }

        #previewTab:hover, #codeTab:hover {
            background: #E9E7DD;
            color: var(--ink);
        }

        #previewTab.active, #codeTab.active {
            background: var(--ink);
            color: #FAFAF7;
        }

        /* ghost / copy button */
        #copyBtn {
            background: transparent;
            color: var(--ink);
            border: 1.5px solid var(--line);
            margin-left: auto;
        }

        #copyBtn:hover {
            border-color: var(--mint);
            color: #00A893;
            background: rgba(0, 212, 181, 0.06);
        }

        /* primary generate button — the signature element */
        #generateBtn {
            position: relative;
            color: #fff;
            background: linear-gradient(100deg, var(--indigo), var(--indigo-deep));
            box-shadow: 0 6px 16px -4px rgba(91, 95, 239, 0.45);
            overflow: hidden;
            isolation: isolate;
            z-index: 0;
        }

        #generateBtn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,0.35) 38%, rgba(255,255,255,0.35) 42%, transparent 60%);
            background-size: 220% 100%;
            background-position: 120% 0;
            transition: background-position 0.6s ease;
            z-index: 1;
        }

        #generateBtn:hover::before {
            background-position: -20% 0;
        }

        #generateBtn:hover {
            box-shadow: 0 8px 22px -4px rgba(91, 95, 239, 0.6);
            transform: translateY(-1px);
        }

        #generateBtn:disabled {
            cursor: progress;
            opacity: 0.9;
            transform: none;
        }

        #generateBtn.is-generating {
            animation: compileGlow 1.1s ease-in-out infinite;
        }

        /* ---------- Status text ---------- */
        #statusText {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13.5px;
            min-height: 18px;
            margin: 18px auto 0;
            max-width: 760px;
            color: var(--ink-soft);
            transition: opacity 0.3s ease;
        }

        #statusText:not(:empty) {
            animation: fadeSlide 0.35s ease-out;
        }

        hr {
            border: none;
            height: 1px;
            background: var(--line);
            max-width: 760px;
            margin: 28px auto;
        }

        /* ---------- Preview / Code panels ---------- */
        #previewSection, #codeSection {
            max-width: 760px;
            margin: 0 auto;
        }

        #previewSection {
            opacity: 0;
            animation: riseIn 0.6s ease-out 0.2s forwards;
        }

        #previewFrame {
            display: block;
            background: #fff;
            box-shadow: 0 1px 2px var(--shadow), 0 24px 48px -28px var(--shadow);
        }

        #codeSection {
            box-shadow: 0 1px 2px var(--shadow), 0 24px 48px -28px var(--shadow);
            border: 1px solid #1e2a4a;
        }

        #codeSection::-webkit-scrollbar {
            width: 10px;
        }
        #codeSection::-webkit-scrollbar-thumb {
            background: #2a3a5e;
            border-radius: 6px;
        }
        #codeSection::-webkit-scrollbar-track {
            background: #0f172a;
        }

        /* ---------- Animations ---------- */
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(0, 212, 181, 0.55); }
            70% { box-shadow: 0 0 0 6px rgba(0, 212, 181, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 212, 181, 0); }
        }

        @keyframes compileGlow {
            0%, 100% { box-shadow: 0 6px 16px -4px rgba(91, 95, 239, 0.45); }
            50% { box-shadow: 0 6px 24px -2px rgba(91, 95, 239, 0.75); }
        }

        @media (max-width: 600px) {
            body { padding: 36px 16px 64px; }
            .console-body { padding: 18px; }
            #copyBtn { margin-left: 0; }
        }
    </style>
</head>
<body>

<!-- Heading -->
<header class="page-head">
    <span class="eyebrow"><span class="dot"></span> AI-powered generation</span>
    <h1>CodeCraft AI <span class="accent">Website Creator</span></h1>
    <p class="subhead">Describe the site you're picturing. Watch CodeCraft write the HTML, CSS, and JS for it in seconds.</p>
</header>

<div class="console">
    <div class="console-bar">
        <span class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></span>
        <span class="label">prompt.txt</span>
    </div>
    <div class="console-body">
        <p class="field-label">Your prompt</p>

        <!-- Prompt Box -->
        <textarea
            id="promptInput"
            placeholder="Describe the website you want..."
            rows="5"
            cols="60"></textarea>

        <div class="btn-row">
            <!-- Generate Button -->
            <button id="previewTab" class="active">Preview</button>
            <button id="codeTab">Code</button>
            <button id="generateBtn">Generate Website</button>
            <button id="copyBtn">Copy Code</button>
        </div>
    </div>
</div>

<p id="statusText"></p>

<hr>

<!-- Preview Frame -->
<div id="previewSection">

    <iframe
        id="previewFrame"
        width="100%"
        height="600"
        style="
            border:1px solid #ccc;
            border-radius:8px;
        ">
    </iframe>

</div>

<pre
    id="codeSection"
    style="
        display:none;
        background:#0f172a;
        color:#e2e8f0;
        border-radius:12px;
        padding:20px;
        overflow:auto;
        height:600px;
        font-family:Consolas, monospace;
        font-size:14px;
        line-height:1.6;
        white-space:pre-wrap;
    ">
</pre>


<script>
    document.getElementById("copyBtn").addEventListener("click", async function() {

    if(!generatedWebsite){
        alert("Generate a website first.");
        return;
    }

    await navigator.clipboard.writeText(generatedWebsite);

    alert("✅ Code copied successfully!");

});

document.getElementById("previewTab").addEventListener("click", function() {

    document.getElementById("previewSection").style.display = "block";

    document.getElementById("codeSection").style.display = "none";

    document.getElementById("previewTab").classList.add("active");
    document.getElementById("codeTab").classList.remove("active");

});

document.getElementById("codeTab").addEventListener("click", function() {

    document.getElementById("previewSection").style.display = "none";

    document.getElementById("codeSection").style.display = "block";

    document.getElementById("codeTab").classList.add("active");
    document.getElementById("previewTab").classList.remove("active");

});


document.getElementById("generateBtn").addEventListener("click", async function() {

    console.log("Button clicked");

    const prompt = document.getElementById("promptInput").value;

    if(prompt.trim() === ""){
        alert("Please enter a prompt.");
        return;
    }

    const btn = document.getElementById("generateBtn");

    btn.innerText = "Generating...";
    btn.disabled = true;
    btn.classList.add("is-generating");

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/generate",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    prompt: prompt
                })
            }
        );

        const data = await response.json();
        generatedWebsite = data.website;

        document.getElementById("codeSection").textContent =
        data.website;

        document.getElementById("statusText").innerText =
        "✅ Website generated successfully!";

        document.getElementById("previewFrame").srcdoc =
        data.website;
        

        document.getElementById("previewFrame").srcdoc =
            data.website;

    } catch(error) {

        console.error(error);
        document.getElementById("statusText").innerText =
        "❌ Failed to generate website.";
        alert("Failed to connect to backend.");

    }

    btn.innerText = "Generate Website";
    btn.disabled = false;
    btn.classList.remove("is-generating");

});

</script>

</body>
</html>
